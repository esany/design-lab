name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  struktur:
    name: Tokens, Studien, Index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Erzeugte Dateien aktuell?
        run: node tools/build.mjs --check
      - name: Gegenbeweise für Stand-Gitter
        run: node tools/gitter-test.mjs

  links:
    name: Interne Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path tools/index.template.html './**/*.md' './**/*.html'
          fail: true

  rendern:
    name: Studien rendern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Rendern und Fehler prüfen
        run: node tools/smoke.mjs .smoke
      - name: Screenshots anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .smoke/
          retention-days: 14

  stand-github:
    name: Stand gegen GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offene Issues und Verlauf prüfen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/stand-github.mjs
